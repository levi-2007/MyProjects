<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Web Chat App</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Firebase SDKs (Compat version for easy single-file use) -->
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-100 h-screen flex flex-col justify-between">

    <!-- LOGIN SCREEN -->
    <div id="loginScreen" class="flex items-center justify-center h-full">
        <div class="bg-white p-8 rounded-lg shadow-md w-96">
            <h2 class="text-2xl font-bold mb-6 text-center text-blue-600">Web Chat Login</h2>
            <input type="text" id="usernameInput" placeholder="Enter your name..." class="w-full px-4 py-2 border rounded-lg mb-4 focus:outline-none focus:ring-2 focus:ring-blue-500">
            <button onclick="loginUser()" class="w-full bg-blue-600 text-white py-2 rounded-lg hover:bg-blue-700 transition">Start Chatting</button>
        </div>
    </div>

    <!-- MAIN CHAT INTERFACE (Hidden initially) -->
    <div id="mainScreen" class="hidden flex h-screen overflow-hidden">
        <!-- Sidebar -->
        <div class="w-1/3 bg-white border-r flex flex-col">
            <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                <div>
                    <h3 id="myNameDisplay" class="font-bold text-gray-800"></h3>
                    <span class="text-xs text-gray-500">ID: <span id="myIdDisplay" class="select-all font-mono"></span></span>
                </div>
                <button onclick="logout()" class="text-red-500 text-sm hover:underline">Logout</button>
            </div>

            <!-- Search & Add User Section -->
            <div class="p-4 border-b">
                <input type="text" id="searchIdInput" placeholder="Enter User ID to connect..." class="w-full px-3 py-1.5 border rounded mb-2 text-sm focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button onclick="sendRequest()" class="w-full bg-green-600 text-white py-1.5 rounded text-sm hover:bg-green-700 transition">Send Request</button>
            </div>

            <!-- Tabs / Lists -->
            <div class="flex-1 overflow-y-auto">
                <div class="p-2 bg-gray-200 text-xs font-semibold text-gray-600">Pending Requests</div>
                <div id="requestsList" class="divide-y"></div>

                <div class="p-2 bg-gray-200 text-xs font-semibold text-gray-600 mt-2">Chats</div>
                <div id="chatsList" class="divide-y"></div>
            </div>
        </div>

        <!-- Chat Window -->
        <div class="w-2/3 flex flex-col bg-gray-50" id="chatWindowArea">
            <div id="noChatSelected" class="flex-1 flex items-center justify-center text-gray-400">
                Select a chat to start messaging
            </div>

            <div id="activeChatContainer" class="hidden flex-1 flex flex-col h-full">
                <!-- Chat Header -->
                <div class="p-4 bg-white border-b font-bold text-gray-700" id="chatHeaderName">Chat Partner</div>
                <!-- Messages Box -->
                <div id="messagesBox" class="flex-1 p-4 overflow-y-auto space-y-3"></div>
                <!-- Message Input -->
                <div class="p-4 bg-white border-t flex gap-2">
                    <input type="text" id="messageInput" placeholder="Type a message..." class="flex-1 px-4 py-2 border rounded-lg focus:outline-none focus:ring-2 focus:ring-blue-500" onkeypress="handleKeyPress(event)">
                    <button onclick="sendMessage()" class="bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition">Send</button>
                </div>
            </div>
        </div>
    </div>

    <!-- FIREBASE CONFIGURATION & APP LOGIC -->
    <script>
        // ==========================================
        // 🛠️ FIREBASE CONFIGURATION (YEKHANE URL LAGBE)
        // ==========================================
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_PROJECT_ID.firebaseapp.com",
            databaseURL: "https://web-chat-app-30ead-default-rtdb.firebaseio.com/", // <-- Firebase Realtime Database URL ekhane boshabe
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_PROJECT_ID.appspot.com",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let myUserId = localStorage.getItem('chat_userId');
        let myName = localStorage.getItem('chat_userName');
        let currentChatId = null;
        let currentPartnerId = null;

        // Auto login if already saved in LocalStorage
        window.onload = () => {
            if (myUserId && myName) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('mainScreen').classList.remove('hidden');
                document.getElementById('myNameDisplay').innerText = myName;
                document.getElementById('myIdDisplay').innerText = myUserId;
                initApp();
            }
        };

        function loginUser() {
            const name = document.getElementById('usernameInput').value.trim();
            if (!name) return alert('Please enter your name!');

            myUserId = 'user_' + Math.random().toString(36).substr(2, 9);
            myName = name;

            localStorage.setItem('chat_userId', myUserId);
            localStorage.setItem('chat_userName', myName);

            // Save user to Firebase Database
            db.ref('users/' + myUserId).set({
                name: myName,
                status: 'online'
            });

            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('mainScreen').classList.remove('hidden');
            document.getElementById('myNameDisplay').innerText = myName;
            document.getElementById('myIdDisplay').innerText = myUserId;
            initApp();
        }

        function logout() {
            localStorage.clear();
            location.reload();
        }

        function initApp() {
            loadRequests();
            loadChats();
        }

        // Send Chat Request
        function sendRequest() {
            const receiverId = document.getElementById('searchIdInput').value.trim();
            if (!receiverId || receiverId === myUserId) return alert('Enter a valid User ID!');

            db.ref('users/' + receiverId).once('value').then(snapshot => {
                if (!snapshot.exists()) {
                    alert('User not found!');
                    return;
                }

                const requestId = [myUserId, receiverId].sort().join('_');
                db.ref('requests/' + requestId).set({
                    from: myUserId,
                    fromName: myName,
                    to: receiverId,
                    status: 'pending'
                });
                alert('Request sent successfully!');
                document.getElementById('searchIdInput').value = '';
            });
        }

        // Load Incoming Requests
        function loadRequests() {
            db.ref('requests').on('value', snapshot => {
                const requestsList = document.getElementById('requestsList');
                requestsList.innerHTML = '';
                
                snapshot.forEach(childSnap => {
                    const req = childSnap.val();
                    if (req.to === myUserId && req.status === 'pending') {
                        requestsList.innerHTML += `
                            <div class="p-2 flex justify-between items-center text-sm">
                                <span>${req.fromName}</span>
                                <button onclick="acceptRequest('${childSnap.key}', '${req.from}', '${req.fromName}')" class="bg-blue-500 text-white px-2 py-1 rounded text-xs">Accept</button>
                            </div>
                        `;
                    }
                });
            });
        }

        function acceptRequest(requestId, partnerId, partnerName) {
            db.ref('requests/' + requestId).update({ status: 'accepted' });
            
            // Create chat room mapping
            const chatId = [myUserId, partnerId].sort().join('_');
            db.ref('chats/' + chatId + '/members').set({
                [myUserId]: myName,
                [partnerId]: partnerName
            });
        }

        // Load Accepted Chats
        function loadChats() {
            db.ref('chats').on('value', snapshot => {
                const chatsList = document.getElementById('chatsList');
                chatsList.innerHTML = '';

                snapshot.forEach(childSnap => {
                    const chat = childSnap.val();
                    if (chat.members && chat.members[myUserId]) {
                        const partnerId = Object.keys(chat.members).find(id => id !== myUserId);
                        const partnerName = chat.members[partnerId];

                        chatsList.innerHTML += `
                            <div onclick="openChat('${childSnap.key}', '${partnerId}', '${partnerName}')" class="p-3 hover:bg-gray-100 cursor-pointer flex items-center justify-between">
                                <span class="font-medium text-sm text-gray-700">${partnerName}</span>
                            </div>
                        `;
                    }
                });
            });
        }

        // Open Chat Window
        function openChat(chatId, partnerId, partnerName) {
            currentChatId = chatId;
            currentPartnerId = partnerId;

            document.getElementById('noChatSelected').classList.add('hidden');
            document.getElementById('activeChatContainer').classList.remove('hidden');
            document.getElementById('chatHeaderName').innerText = partnerName;

            loadMessages();
        }

        // Load Messages in Real-time
        function loadMessages() {
            const msgBox = document.getElementById('messagesBox');
            db.ref('chats/' + currentChatId + '/messages').on('value', snapshot => {
                msgBox.innerHTML = '';
                snapshot.forEach(childSnap => {
                    const msg = childSnap.val();
                    const isMe = msg.sender === myUserId;
                    msgBox.innerHTML += `
                        <div class="flex ${isMe ? 'justify-end' : 'justify-start'}">
                            <div class="max-w-xs px-4 py-2 rounded-lg text-sm ${isMe ? 'bg-blue-600 text-white' : 'bg-white text-gray-800 border'}">
                                ${msg.text}
                            </div>
                        </div>
                    `;
                });
                msgBox.scrollTop = msgBox.scrollHeight;
            });
        }

        function sendMessage() {
            const text = document.getElementById('messageInput').value.trim();
            if (!text || !currentChatId) return;

            db.ref('chats/' + currentChatId + '/messages').push({
                sender: myUserId,
                text: text,
                timestamp: Date.now()
            });

            document.getElementById('messageInput').value = '';
        }

        function handleKeyPress(e) {
            if (e.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
